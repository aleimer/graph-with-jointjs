name: Deploy demo

# Publishes the playground to GitHub Pages on every push to main.
#
# The app is served from a subpath (/graph-with-jointjs/), not a domain root.
# Its two runtime fetches — `graph.json` and `libavoid.wasm` — are relative, so
# they resolve against the <base href> the production build writes into
# index.html. That base href lives in angular.json rather than in a flag here,
# so a local production build is the same build this workflow deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push supersede one still queued.
# `cancel-in-progress` is deliberately false: cancelling mid-deploy can leave
# Pages serving a half-written artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The unit tests gate the deploy. They run on jsdom through the Angular
      # CLI, so no browser is needed — and running vitest directly would miss
      # the CLI's test configuration and fail on missing globals.
      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --configuration production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/graph-with-jointjs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
