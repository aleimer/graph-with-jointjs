name: CI

# Builds and tests every push to a long-lived branch, and deploys only what
# reaches main.
#
# Work happens on develop; main moves when a merge is asked for. So the gate
# has to sit on develop too — testing only on main would mean finding out a
# change is broken at the moment it goes live, which is the one moment it
# cannot be allowed to be.
#
# The app is served from a subpath (/graph-with-jointjs/), not a domain root.
# Its two runtime fetches — `graph.json` and `libavoid.wasm` — are relative, so
# they resolve against the <base href> the production build writes into
# index.html. That base href lives in angular.json rather than in a flag here,
# so a local production build is the same build this workflow deploys.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch. `cancel-in-progress` is deliberately false: cancelling
# mid-deploy can leave Pages serving a half-written artifact.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The unit tests gate the deploy. They run on jsdom through the Angular
      # CLI, so no browser is needed — and running vitest directly would miss
      # the CLI's test configuration and fail on missing globals.
      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --configuration production

      # Only what is going live needs packaging.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist/graph-with-jointjs/browser

  deploy:
    needs: build
    # Nothing but a push to main publishes. A pull request targeting main is
    # built and tested like any other, but it does not deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
